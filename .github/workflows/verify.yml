# Lint, typecheck, test and smoke-launch on Windows and Linux for every pull request.
# macOS is verify-macos.yml: weekly, on demand, and when platform or workflow files change.
# A merge to main does not run this again, unless the merge changes this file or verify-os.yml.
name: verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify.yml"
      - ".github/workflows/verify-os.yml"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/verify-os.yml
    with:
      os: ubuntu-latest
  windows:
    name: Windows
    uses: ./.github/workflows/verify-os.yml
    with:
      os: windows-latest
