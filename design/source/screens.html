<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=block" rel="stylesheet">
<style>
:root{--bg:#121212;--sidebar:#0E0E0E;--surface:#1F1F1F;--fill:rgba(245,245,245,.04);--fill2:rgba(245,245,245,.08);--ink:#F5F5F5;--ink2:rgba(245,245,245,.66);--ink3:rgba(245,245,245,.54);--line:rgba(245,245,245,.06);--line2:rgba(245,245,245,.10);--accent:#4D9BFF;--accent2:#116DD2;--toggle:#1C6FD9;--star:#F69412;--userBubble:#C8770C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{width:1040px;height:760px;background:var(--bg);position:relative;overflow:hidden;display:flex;margin:0 0 40px}
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.t12{font-size:12px;line-height:16px}.t13{font-size:13px;line-height:18px}.t14{font-size:14px;line-height:20px}.t15{font-size:15px;line-height:22px;letter-spacing:.01em}
.m{font-weight:500}.sb{font-weight:600}.i2{color:var(--ink2)}.i3{color:var(--ink3)}
.sidebar{width:88px;height:760px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;gap:10px}
.iconbtn{width:36px;height:36px;border-radius:9999px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.tile.tsel{background:var(--fill2)}
.dot{position:absolute;left:35px;top:35px;width:11px;height:11px;border-radius:9999px;border:1.5px solid #161616}
.sfoot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.small{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.avatar36{width:36px;height:36px;border-radius:9999px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;letter-spacing:-.025em;color:var(--ink2)}
.main{flex-grow:1;position:relative;display:flex;flex-direction:column;padding:0 16px 16px;min-width:0}
.header{height:62px;flex-shrink:0;position:relative;display:flex;justify-content:center;padding-top:10px}
.pill{height:41px;display:flex;align-items:center;gap:8px;padding:7.5px 13.5px 7.5px 7.5px;border-radius:9999px;background:var(--surface);border:1px solid var(--line)}
.share{position:absolute;top:13px;height:36px;padding:8px 16px;border-radius:9999px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:20px}
.thread{flex-grow:1;display:flex;flex-direction:column;gap:12px;overflow:hidden;min-height:0}
.bubble{padding:7px 12px;border-radius:18px;background:var(--fill);box-shadow:inset 0 0 0 .5px rgba(245,245,245,.06);font-size:15px;line-height:22px;letter-spacing:.01em}
.card{border-radius:24px;background:var(--surface);box-shadow:0 0 0 .5px rgba(245,245,245,.1)}
.composer{height:44px;flex-shrink:0;border-radius:22px;background:var(--surface);border:1px solid var(--line2);display:flex;align-items:center;padding:0 7px;gap:8px}
.cbtn{width:28px;height:28px;border-radius:9999px;background:var(--fill);box-shadow:inset 0 0 0 .5px rgba(245,245,245,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu{position:absolute;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;flex-direction:column}
.mi{height:34px;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:10px;font-size:14px;line-height:18px;letter-spacing:.01em}
.mi.hl{background:var(--fill2)}
.div{height:11px;display:flex;align-items:center;padding:0 10px}.div i{display:block;height:1px;flex-grow:1;background:var(--line2)}
.scrim{position:absolute;left:0;top:0;width:1040px;height:760px;background:rgba(0,0,0,.5)}
.modal{position:absolute;border-radius:14px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 24px 64px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.mhead{height:56px;flex-shrink:0;padding:0 11px 0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2)}
.mfoot{height:58px;flex-shrink:0;padding:0 13px;display:flex;align-items:center;justify-content:flex-end;gap:8px;border-top:1px solid var(--line2)}
.btn{height:32px;padding:0 14px;border-radius:9999px;display:flex;align-items:center;font-size:14px;line-height:20px;font-weight:500;flex-shrink:0}
.btn.ghost{border:1px solid rgba(245,245,245,.14)}.btn.light{background:var(--ink);color:#121212}.btn.dis{background:rgba(245,245,245,.16);color:rgba(245,245,245,.4)}.btn.soft{background:var(--fill);box-shadow:inset 0 0 0 .5px rgba(245,245,245,.04);font-weight:400}
.close{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.panel{width:320px;height:760px;flex-shrink:0;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:12px;position:relative}
.group{padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:288px}
.sel{height:24px;padding:2px 4px 2px 6px;border-radius:8px;border:1px solid rgba(245,245,245,.04);display:flex;align-items:center;gap:3px;font-size:13px;line-height:18px;letter-spacing:-.006em}
.kbd{height:20px;min-width:20px;padding:0 5px;border-radius:5px;background:var(--fill2);border:1px solid var(--line);font-size:11px;line-height:18px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.toggle{width:32px;height:20px;border-radius:9999px;padding:2px;display:flex;align-items:center;flex-shrink:0}.toggle.on{background:var(--toggle);justify-content:flex-end}.toggle.off{background:rgba(245,245,245,.16)}.toggle i{display:block;width:16px;height:16px;border-radius:9999px;background:#fff}
.srow{padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.scard{border-radius:14px;background:var(--surface);padding:8px 0;display:flex;flex-direction:column}
.slabel{padding-left:14px;font-size:12px;line-height:16px;color:var(--ink2)}
.ssel{height:26px;padding:0 6px 0 8px;border-radius:8px;border:1px solid rgba(245,245,245,.08);display:flex;align-items:center;gap:4px;font-size:13px;line-height:18px;flex-shrink:0}
.chip{height:28px;padding:0 10px;border-radius:9999px;background:var(--fill);display:flex;align-items:center;font-size:13px;line-height:18px;letter-spacing:.015em}
.appicon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conn{width:96px;height:26px;border-radius:9999px;background:var(--fill2);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:16px;font-weight:500;flex-shrink:0}
code{font-family:'JetBrains Mono',monospace;font-size:13.95px;color:var(--ink2);background:rgba(245,245,245,.02);border-radius:4px;padding:0 4px}
</style></head><body><div id="root"></div>
